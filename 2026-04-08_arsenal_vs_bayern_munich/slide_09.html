<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #0a0a0a; color: #e8e8e8;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 60px;
  }
  .minute { font-size: 24px; color: #00d4aa; font-weight: 600; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
  .headline { font-size: 44px; font-weight: 700; margin-bottom: 30px; line-height: 1.2; }
  .body { font-size: 28px; color: #888888; line-height: 1.6; max-width: 800px; }
  .slide-num { position: absolute; bottom: 40px; right: 60px; font-size: 18px; color: #888888; }
</style>
</head><body>
  <div class="minute">78'</div>
  <div class="headline">Saka pulled one back.</div>
  <div class="body">Too late. Bayern shifted into game management — low block, time-wasting, professional. Arsenal had 78% possession in the last 15 minutes and created nothing.</div>
  <div class="slide-num">9/11</div>
</body></html>
