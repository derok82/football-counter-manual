<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #0a0a0a; color: #e8e8e8;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 80px 60px;
  }
  .label { font-size: 28px; color: #888888; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 40px; }
  .number { font-size: 140px; font-weight: 900; color: #00d4aa; }
  .context { font-size: 28px; color: #888888; margin-top: 40px; text-align: center; line-height: 1.5; max-width: 800px; }
  .slide-num { position: absolute; bottom: 40px; right: 60px; font-size: 18px; color: #888888; }
</style>
</head><body>
  <div class="label">Chances from channel runs</div>
  <div class="number">5</div>
  <div class="context">All five of Bayern's big chances came from balls into the channel behind Arsenal's advancing CBs. Same weakness, over and over.</div>
  <div class="slide-num">8/11</div>
</body></html>
