<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #0a0a0a; color: #e8e8e8;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 60px;
  }
  .title { font-size: 32px; font-weight: 700; margin-bottom: 60px; }
  .title span { color: #00d4aa; }
  .team { margin-bottom: 60px; }
  .team-name { font-size: 28px; font-weight: 600; margin-bottom: 15px; }
  .formation { font-size: 72px; font-weight: 900; color: #00d4aa; }
  .note { font-size: 24px; color: #888888; margin-top: 10px; }
  .slide-num { position: absolute; bottom: 40px; right: 60px; font-size: 18px; color: #888888; }
</style>
</head><body>
  <div class="title"><span>The Setup</span></div>
  <div class="team">
    <div class="team-name">Arsenal</div>
    <div class="formation">4-3-3</div>
    <div class="note">Hybrid press, Rice holding</div>
  </div>
  <div class="team">
    <div class="team-name">Bayern Munich</div>
    <div class="formation">4-2-3-1</div>
    <div class="note">Two free roamers, FBs high</div>
  </div>
  <div class="slide-num">2/11</div>
</body></html>
