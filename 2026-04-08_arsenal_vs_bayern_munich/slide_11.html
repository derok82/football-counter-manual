<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #0a0a0a; color: #e8e8e8;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 80px 60px;
  }
  .line { width: 60px; height: 3px; background: #00d4aa; margin-bottom: 50px; }
  .text { font-size: 44px; font-weight: 600; text-align: center; line-height: 1.4; max-width: 800px; }
  .credit { font-size: 20px; color: #888888; margin-top: 60px; text-transform: uppercase; letter-spacing: 3px; }
  .slide-num { position: absolute; bottom: 40px; right: 60px; font-size: 18px; color: #888888; }
</style>
</head><body>
  <div class="line"></div>
  <div class="text">Structured pressing breaks when there's nothing to press. Kompany's chaos is the antidote to discipline.</div>
  <div class="credit">MatchBrief</div>
  <div class="slide-num">11/11</div>
</body></html>
