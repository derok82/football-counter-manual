<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    width: 1080px; height: 1920px;
    background: #0a0a0a; color: #e8e8e8;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 80px 60px;
  }
  .badge { font-size: 28px; color: #00d4aa; margin-bottom: 40px; font-weight: 600; text-transform: uppercase; letter-spacing: 4px; }
  .match { font-size: 48px; font-weight: 800; text-align: center; margin-bottom: 20px; line-height: 1.2; }
  .score { font-size: 120px; font-weight: 900; color: #00d4aa; margin: 30px 0; }
  .hook { font-size: 36px; font-weight: 500; text-align: center; color: #888888; margin-top: 40px; line-height: 1.4; max-width: 800px; }
  .slide-num { position: absolute; bottom: 40px; right: 60px; font-size: 18px; color: #888888; }
</style>
</head><body>
  <div class="badge">MatchBrief</div>
  <div class="match">Arsenal vs Bayern Munich</div>
  <div class="score">1 - 2</div>
  <div class="hook">Bayern's controlled chaos dismantled Arsenal's press. Here's how it happened.</div>
  <div class="slide-num">1/11</div>
</body></html>
